<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <radialGradient id="goldNucleus" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <radialGradient id="goldElectron" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Title Badge -->
  <text x="150" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#854d0e" text-anchor="middle">GOLD ATOM (Au · Z=79)</text>

  <!-- Shell Orbits -->
  <ellipse cx="150" cy="112" rx="110" ry="42" fill="none" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="4,4" transform="rotate(-30 150 112)"/>
  <ellipse cx="150" cy="112" rx="110" ry="42" fill="none" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="4,4" transform="rotate(30 150 112)"/>
  <ellipse cx="150" cy="112" rx="115" ry="45" fill="none" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="4,4"/>

  <!-- Electrons -->
  <circle cx="58" cy="85" r="6" fill="url(#goldElectron)"/>
  <circle cx="242" cy="139" r="6" fill="url(#goldElectron)"/>
  <circle cx="70" cy="138" r="6" fill="url(#goldElectron)"/>
  <circle cx="230" cy="86" r="6" fill="url(#goldElectron)"/>
  <circle cx="150" cy="67" r="6" fill="url(#goldElectron)"/>
  <circle cx="150" cy="157" r="6" fill="url(#goldElectron)"/>

  <!-- Gold Nucleus Core -->
  <circle cx="150" cy="112" r="28" fill="url(#goldNucleus)" stroke="#a16207" stroke-width="2.5"/>
  <text x="150" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" fill="#713f12" text-anchor="middle">79 Au</text>

  <!-- Subtitle -->
  <text x="150" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#a16207" text-anchor="middle">[Xe] 4f¹⁴ 5d¹⁰ 6s¹ · Kim loại quý trơ bậc nhất</text>
</svg>
