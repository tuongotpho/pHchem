<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <radialGradient id="carbonNode" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Title Badge -->
  <text x="150" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#0369a1" text-anchor="middle">GRAPHENE HONEYCOMB LATTICE</text>

  <!-- Hexagon Grid Lines -->
  <g stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Center Hexagon -->
    <polygon points="150,60 185,80 185,120 150,140 115,120 115,80"/>
    <!-- Left Hexagon -->
    <polygon points="115,80 80,60 45,80 45,120 80,140 115,120"/>
    <!-- Right Hexagon -->
    <polygon points="185,80 220,60 255,80 255,120 220,140 185,120"/>
    <!-- Top partial connections -->
    <line x1="150" y1="60" x2="150" y2="40"/>
    <line x1="80" y1="60" x2="80" y2="40"/>
    <line x1="220" y1="60" x2="220" y2="40"/>
    <!-- Bottom partial connections -->
    <line x1="150" y1="140" x2="150" y2="160"/>
    <line x1="80" y1="140" x2="80" y2="160"/>
    <line x1="220" y1="140" x2="220" y2="160"/>
  </g>

  <!-- Carbon Atoms (Nodes) -->
  <g fill="url(#carbonNode)" stroke="#0c4a6e" stroke-width="1.5">
    <circle cx="150" cy="60" r="7"/>
    <circle cx="185" cy="80" r="7"/>
    <circle cx="185" cy="120" r="7"/>
    <circle cx="150" cy="140" r="7"/>
    <circle cx="115" cy="120" r="7"/>
    <circle cx="115" cy="80" r="7"/>
    <circle cx="80" cy="60" r="7"/>
    <circle cx="45" cy="80" r="7"/>
    <circle cx="45" cy="120" r="7"/>
    <circle cx="80" cy="140" r="7"/>
    <circle cx="220" cy="60" r="7"/>
    <circle cx="255" cy="80" r="7"/>
    <circle cx="255" cy="120" r="7"/>
    <circle cx="220" cy="140" r="7"/>
  </g>

  <!-- Subtitle -->
  <text x="150" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="middle">Mạng lưới Carbon sp² 2D · Cứng gấp 200 lần thép</text>
</svg>
