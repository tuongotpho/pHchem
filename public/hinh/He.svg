<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <radialGradient id="heNucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="heProton" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="heNeutron" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="heElectron" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
  </defs>

  <!-- Title Badge -->
  <text x="150" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">HELIUM ATOM (He · Z=2)</text>

  <!-- Orbit 1 -->
  <ellipse cx="150" cy="115" rx="100" ry="40" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" transform="rotate(-25 150 115)"/>
  <!-- Orbit 2 -->
  <ellipse cx="150" cy="115" rx="100" ry="40" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" transform="rotate(25 150 115)"/>

  <!-- Electrons -->
  <!-- e- on Orbit 1 -->
  <circle cx="68" cy="78" r="7" fill="url(#heElectron)"/>
  <circle cx="232" cy="152" r="7" fill="url(#heElectron)"/>

  <!-- Nucleus Cluster (2 Protons + 2 Neutrons) -->
  <g transform="translate(150, 115)">
    <circle cx="-9" cy="-8" r="14" fill="url(#heProton)"/>
    <text x="-9" y="-4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">p⁺</text>

    <circle cx="9" cy="-6" r="14" fill="url(#heNeutron)"/>
    <text x="9" y="-2" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">n⁰</text>

    <circle cx="-8" cy="10" r="14" fill="url(#heNeutron)"/>
    <text x="-8" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">n⁰</text>

    <circle cx="10" cy="9" r="14" fill="url(#heProton)"/>
    <text x="10" y="13" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">p⁺</text>
  </g>

  <!-- Labels -->
  <text x="150" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Cấu hình 1s² · 2 Proton + 2 Neutron + 2 Electron</text>
</svg>
