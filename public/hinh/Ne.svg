<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <radialGradient id="neGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
    <radialGradient id="neElectron" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </radialGradient>
  </defs>

  <!-- Title Badge -->
  <text x="150" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#be123c" text-anchor="middle">NEON ATOM (Ne · Z=10)</text>

  <!-- Orbits -->
  <circle cx="150" cy="112" r="50" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4,4"/>
  <circle cx="150" cy="112" r="75" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4,4"/>

  <!-- Nucleus -->
  <circle cx="150" cy="112" r="24" fill="url(#neGlow)" stroke="#9f1239" stroke-width="2"/>
  <text x="150" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">10 Ne</text>

  <!-- Electrons: 2 inside, 8 outside (Octet) -->
  <circle cx="150" cy="62" r="5.5" fill="url(#neElectron)"/>
  <circle cx="150" cy="162" r="5.5" fill="url(#neElectron)"/>

  <!-- Outer 8 electrons -->
  <circle cx="150" cy="37" r="5.5" fill="url(#neElectron)"/>
  <circle cx="150" cy="187" r="5.5" fill="url(#neElectron)"/>
  <circle cx="75" cy="112" r="5.5" fill="url(#neElectron)"/>
  <circle cx="225" cy="112" r="5.5" fill="url(#neElectron)"/>
  <circle cx="97" cy="59" r="5.5" fill="url(#neElectron)"/>
  <circle cx="203" cy="165" r="5.5" fill="url(#neElectron)"/>
  <circle cx="97" cy="165" r="5.5" fill="url(#neElectron)"/>
  <circle cx="203" cy="59" r="5.5" fill="url(#neElectron)"/>

  <!-- Subtitle -->
  <text x="150" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#be123c" text-anchor="middle">1s² 2s² 2p⁶ · Bát tử bền vững phát ánh đỏ cam</text>
</svg>
